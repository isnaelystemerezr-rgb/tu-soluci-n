name: tu_solution
description: Taller de reparaciones - Segundo Parcial Programación para Dispositivos Móviles (Flutter + Drift + Riverpod, MVVM)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  drift: ^2.19.0
  sqlite3_flutter_libs: ^0.5.14
  path_provider: ^2.1.2
  path: ^1.8.3
  intl: ^0.18.1
  go_router: ^12.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.3.4
  build_runner: ^2.4.7
  drift_dev: ^2.19.0
  custom_lint: ^0.6.0

flutter:
  uses-material-design: true
